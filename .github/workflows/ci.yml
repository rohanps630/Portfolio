name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build & Validate Content
        run: bun run build

      - name: Check internal links
        run: bun run check-links

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run Playwright Tests
        run: bunx playwright test
        env:
          # The suite runs against `next start` (production): without a Resend
          # key the contact API now fails loudly, so e2e opts into dry-run.
          CONTACT_FORM_DRY_RUN: "1"

      - name: Run Lighthouse CI
        run: bunx lhci autorun
